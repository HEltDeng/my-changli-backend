server {
    listen 80;
    listen [::]:80;
    server_name candidate.mychangliapp.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/mychangli-candidate-acme; }
    location / { return 301 https://candidate.mychangliapp.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name candidate.mychangliapp.cn;
    ssl_certificate /etc/letsencrypt/live/candidate.mychangliapp.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candidate.mychangliapp.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-MyChangli-Environment "isolated-candidate" always;
    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Server;
    }
}
